  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: redis-elasticache
  namespace: parkir-pintar
spec:
  hosts:
    - parkirpintar.habhke.ng.0001.apse3.cache.amazonaws.com
  location: MESH_EXTERNAL
  ports:
    - number: 6379
      name: tcp-redis
      protocol: TCP
  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: rabbitmq-amazonmq
  namespace: parkir-pintar
spec:
  hosts:
    - b-4b6ce9b9-dadd-400e-88f3-5c9eee6a9e27.mq.ap-southeast-3.on.aws
  location: MESH_EXTERNAL
  ports:
    - number: 5671
      name: tcp-amqps
      protocol: TCP
  resolution: DNS
---
# DestinationRules for external services
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: postgres-rds
  namespace: parkir-pintar
spec:
  host: "*.cjeuw4isav83.ap-southeast-3.rds.amazonaws.com"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 5s
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 60s
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: redis-elasticache
  namespace: parkir-pintar
spec:
  host: parkirpintar.habhke.ng.0001.apse3.cache.amazonaws.com
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 3s
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: rabbitmq-amazonmq
  namespace: parkir-pintar
spec:
  host: b-4b6ce9b9-dadd-400e-88f3-5c9eee6a9e27.mq.ap-southeast-3.on.aws
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 30
        connectTimeout: 5s
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 30s
      baseEjectionTime: 60s
