# ServiceEntry resources register external services (databases, caches, message queues)
# in the Istio mesh so that traffic to them is tracked, measurable, and visible
# in the service topology (Kiali, Grafana dashboards).
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: postgres-reservation
  namespace: parkir-pintar
spec:
  hosts:
    - parkirpintar-reservation.cjeuw4isav83.ap-southeast-3.rds.amazonaws.com
  location: MESH_EXTERNAL
  ports:
    - number: 5432
      name: tcp-postgres
      protocol: TCP
  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: postgres-reservation-replica
  namespace: parkir-pintar
spec:
  hosts:
    - parkirpintar-reservation-replica.cjeuw4isav83.ap-southeast-3.rds.amazonaws.com
  location: MESH_EXTERNAL
  ports:
    - number: 5432
      name: tcp-postgres
      protocol: TCP
  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: postgres-billing
  namespace: parkir-pintar
spec:
  hosts:
    - parkirpintar-billing.cjeuw4isav83.ap-southeast-3.rds.amazonaws.com
  location: MESH_EXTERNAL
  ports:
    - number: 5432
      name: tcp-postgres
      protocol: TCP
  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: postgres-payment
  namespace: parkir-pintar
spec:
  hosts:
    - parkirpintar-payment.cjeuw4isav83.ap-southeast-3.rds.amazonaws.com
  location: MESH_EXTERNAL
  ports:
    - number: 5432
      name: tcp-postgres
      protocol: TCP
  resolution: DNS
---
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: postgres-analytics
  namespace: parkir-pintar
spec:
  hosts:
    - parkirpintar-analytics.cjeuw4isav83.ap-southeast-3.rds.amazonaws.com
  location: MESH_EXTERNAL
  ports:
    - number: 5432
      name: tcp-postgres
